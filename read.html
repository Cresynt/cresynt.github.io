<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>arrow left - articles</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#111111" />
        <link id="theme-style" rel="stylesheet" href="light.css" />
        <link id="style" rel="stylesheet" href="style.css" />
        <link rel="icon" href="images/favicon.ico" />

        <!-- Supabase SDK -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet" />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    </head>

    <body>
        <div class="container">
            <header>
                <nav>
                    <a href="javascript:history.back()" class="back-btn"
                        ><span class="material-symbols-outlined"> arrow_left </span></a
                    >
                    <a href="index.html">home</a>
                    <a href="projects.html">projects</a>
                    <a href="blogs.html">blogs</a>
                    <a href="about.html">about</a>
                </nav>
            </header>

            <main>
                <article id="article-content" class="article-content">
                    <p>Loading...</p>
                </article>
            </main>

            <footer>
                <p>End.</p>
                <p>arrow left</p>
            </footer>
        </div>

        <!-- Theme Script -->
        <script>
            const themeLink = document.getElementById("theme-style");
            const savedTheme = localStorage.getItem("theme") || "dark";

            function setTheme(mode) {
                if (mode === "dark") {
                    themeLink.href = "dark.css";
                    document.documentElement.style.colorScheme = "dark";
                } else {
                    themeLink.href = "light.css";
                    document.documentElement.style.colorScheme = "light";
                }
            }
            setTheme(savedTheme);
        </script>

        <!-- Supabase Logic -->
        <script>
            const SUB_URL = "https://lwfxqjojwfcubzuaxfsn.supabase.co";
            const SUB_KEY = "sb_publishable_5cJkjiZvaD_DBxmlmEM1Tg_Hon0SJy7";
            const supabaseClient = supabase.createClient(SUB_URL, SUB_KEY);

            async function loadArticle() {
                const container = document.getElementById("article-content");
                const tag = window.location.hash.substring(1);

                if (!tag) {
                    container.innerHTML = "<p>i think you dropped the tag</p>";
                    return;
                }

                try {
                    // Fetch specifically where 'tag' matches URL hash
                    const { data: post, error } = await supabaseClient
                        .from('blogs')
                        .select('title, content')
                        .eq('tag', tag)
                        .single();

                    if (error || !post) {
                        container.innerHTML = "<p>i havent written that yet</p>";
                        return;
                    }

                    // Injected content from DB
                    container.innerHTML = post.content;

                    // Execute any scripts found in the injected HTML
                    const scripts = container.querySelectorAll("script");
                    scripts.forEach((oldScript) => {
                        const newScript = document.createElement("script");
                        Array.from(oldScript.attributes).forEach((attr) => {
                            newScript.setAttribute(attr.name, attr.value);
                        });
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    document.title = `arrow left - ${post.title}`;
                } catch (err) {
                    container.innerHTML = "<p>i think i got distracted</p>";
                    console.error(err);
                }
            }

            window.addEventListener("hashchange", loadArticle);
            loadArticle();
        </script>
    </body>
</html>
