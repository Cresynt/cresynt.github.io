<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>arrow left - articles</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#111111" />
        <link id="theme-style" rel="stylesheet" href="light.css" />
        <link id="style" rel="stylesheet" href="style.css" />
        <link rel="icon" href="images/favicon.ico" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet" />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    </head>

    <body>
        <div class="container">
            <header>
                <nav>
                    <a href="javascript:history.back()" class="back-btn"
                        ><span class="material-symbols-outlined"> arrow_left </span></a
                    >
                    <a href="">home</a>
                    <a href="projects.html">projects</a>
                    <a href="blogs.html">blogs</a>
                    <a href="about.html">about</a>
                </nav>
            </header>

            <main>
                <article id="article-content" class="article-content">
                    <p>Loading...</p>
                </article>
            </main>

            <footer>
                <p>arrow left</p>
            </footer>
        </div>

        <script>
            const themeLink = document.getElementById("theme-style");
            const toggleBtn = document.getElementById("theme-toggle");
            const themeIcon = document.getElementById("theme-icon");

            // Get the preference from the user's browser memory
            const savedTheme = localStorage.getItem("theme");

            function setTheme(mode) {
                if (mode === "dark") {
                    themeLink.href = "dark.css";
                    document.documentElement.style.colorScheme = "dark";
                    themeIcon.src = "images/sun-icon.png";
                    themeIcon.alt = "light mode";
                    localStorage.setItem("theme", "dark");
                } else {
                    themeLink.href = "light.css";
                    document.documentElement.style.colorScheme = "light";
                    themeIcon.src = "images/moon-icon.png";
                    themeIcon.alt = "dark mode";
                    localStorage.setItem("theme", "light");
                }
            }

            // If the user has a saved preference, use it.
            // If they are a new visitor, force the dark theme.
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                setTheme("dark");
            }

            // Handle the click event for the theme switcher button
            toggleBtn.addEventListener("click", () => {
                themeIcon.style.transform = "scale(0)";
                setTimeout(() => {
                    const current = localStorage.getItem("theme");
                    setTheme(current === "dark" ? "light" : "dark");
                    void themeIcon.offsetWidth;
                    themeIcon.style.transform = "scale(1)";
                }, 120);
            });
        </script>

        <script>
            async function loadArticle() {
                const container = document.getElementById("article-content");
                const tag = window.location.hash.substring(1);

                if (!tag) {
                    container.innerHTML = "<p>i think you dropped the tag</p>";
                    return;
                }

                try {
                    // Direct fetch using the tag from the URL
                    const fileRes = await fetch(`articles/${tag}.html`);

                    if (!fileRes.ok) {
                        container.innerHTML = "<p>i havent written that yet</p>";
                        return;
                    }

                    const html = await fileRes.text();

                    // Inject the HTML
                    container.innerHTML = html;

                    // Manually find and execute scripts within the injected HTML
                    const scripts = container.querySelectorAll("script");
                    scripts.forEach((oldScript) => {
                        const newScript = document.createElement("script");

                        // Copy all attributes (src, type, etc.)
                        Array.from(oldScript.attributes).forEach((attr) => {
                            newScript.setAttribute(attr.name, attr.value);
                        });

                        // Copy the script content
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));

                        // Replacing the element triggers execution
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // Update page title dynamically using the tag name
                    const formattedTitle = tag.charAt(0).toUpperCase() + tag.slice(1);
                    document.title = `arrow left - ${formattedTitle}`;
                } catch (err) {
                    container.innerHTML = "<p>i think i got distracted</p>";
                    console.error(err);
                }
            }

            // Listen for hash changes so the page updates without refreshing
            window.addEventListener("hashchange", loadArticle);
            loadArticle();
        </script>
    </body>
</html>
